# ===== Server =====
server.port=${PORT:8080}

# ===== Database =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:your-long-random-secret-key-here}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads/resumes}

# ===== Groq AI =====
app.groq.api-url=https://api.groq.com/openai/v1/chat/completions
app.groq.api-key=${GROQ_API_KEY}

# ===== GitHub (optional) =====
app.github.token=${GITHUB_TOKEN}
app.github.api-url=https://api.github.com

# ===== Code Execution (Judge0 - Free Public Instance) =====
app.judge0.api-url=https://ce.judge0.com

# ===== CORS =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===== Logging =====
logging.level.com.ak.devforge=${LOG_LEVEL:INFO}

spring.devtools.restart.enabled=false